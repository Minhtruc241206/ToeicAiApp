{%extends 'Layout/base.html'%}
{%block content%}

<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">



    <main class="flex-1 max-w-6xl w-full mx-auto p-6">

        <section id="login-section" class="login-bg rounded-3xl py-10 sm:py-16 flex justify-center">

                <div class="mx-auto w-16 h-16 rounded-2xl overflow-hidden shadow-lg">
                <img
                    src="/static/img/bc42385225b6f42babcd6a65b914752c.jpg"

                    class="w-full h-full object-cover"
                >
            </div>

                <h2 class="mt-6 text-2xl font-extrabold text-slate-900">Chào mừng đến với dự án nhỏ của mình👋</h2>

                </p>

                <!-- Nút Google (do Google tự render) -->
               <div class="mt-8 flex justify-center">

    <a href="/login/google" class="flex items-center justify-center bg-white border border-slate-300 rounded-full px-6 py-2.5 text-slate-700 font-medium hover:bg-slate-50 hover:shadow-md transition shadow-sm w-[300px]">

        <!-- Logo Google -->
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google Logo" class="w-5 h-5 mr-3">

</div>

                <!-- Điểm nổi bật -->

                    </div>
                    <div class="flex flex-col items-center gap-1.5">
